<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brawl Drafter</title>
<style>
:root{--bg:#15151a;--card:#20202a;--tx:#f2f2f5;--mu:#9a9aa6;--ac:#f5b700;--bd:#33333f;--ban:#ff6b6b;--ok:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:4px 0 4px}
p{color:var(--mu);font-size:13px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input[type=password]{width:100%;background:#12151a;color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:11px;font:inherit}
.bt{display:block;width:100%;background:var(--ac);color:#1b1b1f;border:0;border-radius:12px;padding:14px;font:700 16px system-ui;margin-top:10px;text-align:center}
.bt:disabled{opacity:.5}
#st{font-size:13px;color:var(--mu);min-height:20px;margin-top:8px}
#prev{max-width:100%;border-radius:10px;margin-top:8px;display:none}
#hb h4{margin:10px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu)}
.it{display:flex;gap:8px;align-items:baseline;padding:4px 0;flex-wrap:wrap}
.it b{font-size:17px}.it span{color:var(--mu);font-size:12px}
.bn b{color:var(--ban)}.pk b{color:var(--ok)}
.det{color:var(--mu);font-size:12px;line-height:1.5;margin-top:6px}
</style>
</head>
<body>
<h1>⚔️ Brawl Drafter</h1>
<p>Draft ekranının ekran görüntüsünü seç. Claude haritayı, banları ve seçimleri okur; kimi yasaklayıp kimi seçeceğini söyler.</p>
<div class="card">
<input type="password" id="key" placeholder="Anthropic API anahtarı (sk-ant-...)" autocomplete="off">
<button class="bt" id="pick">📷 Ekran görüntüsü seç</button>
<input type="file" id="file" accept="image/*" hidden>
<div id="st">Hazır.</div>
<img id="prev" alt="">
</div>
<div class="card"><div id="hb"><div class="det">Henüz analiz yok.</div></div></div>
<script>
const B={"Wendy":["Kontrol",9],"Shade":["Suikastçı",9],"Juju":["Kontrol",8.5],"Bolt":["Nişancı",8.5],"Trunk":["Tank",8],"Mr. P":["Kontrol",8.5],"Bibi":["Hasar",8.5],"Hank":["Tank",8.5],"Bo":["Kontrol",8],"Chuck":["Kontrol",8],"Edgar":["Suikastçı",8],"Angelo":["Nişancı",8],"Gus":["Destek",7.5],"Amber":["Kontrol",7.5],"Nori":["Hasar",7.5],"Starr Nova":["Hasar",7.5],"Colt":["Nişancı",7],"Dynamike":["Topçu",6.5],"Pam":["Destek",7],"Squeak":["Kontrol",6.5],"Moe":["Hasar",7],"Cosmo":["Kontrol",7],"Meg":["Hasar",6.5],"Rosa":["Tank",6.5],"Draco":["Tank",6],"El Primo":["Tank",6.5],"Lily":["Suikastçı",6.5],"Buster":["Tank",6],"Shelly":["Hasar",5.5],"Bull":["Tank",6],"Leon":["Suikastçı",6.5],"Crow":["Suikastçı",6],"Mortis":["Suikastçı",6.5],"Buzz":["Suikastçı",6],"Rico":["Nişancı",5.5],"Sam":["Hasar",6],"Frank":["Tank",6],"Doug":["Destek",6],"Darryl":["Tank",6],"Piper":["Nişancı",6],"Brock":["Nişancı",6],"Belle":["Nişancı",6.5],"Byron":["Destek",6],"Max":["Destek",6],"Poco":["Destek",6],"Gene":["Kontrol",5.5],"Kit":["Destek",6]};
const C={"Suikastçı":{"Nişancı":1,"Topçu":1,"Destek":.5,"Tank":-1,"Kontrol":-.5},"Tank":{"Suikastçı":1,"Hasar":.5,"Nişancı":-1,"Topçu":-1},"Nişancı":{"Tank":1,"Kontrol":.5,"Suikastçı":-1,"Hasar":-.5},"Topçu":{"Tank":1,"Kontrol":.5,"Suikastçı":-1,"Nişancı":-.5},"Kontrol":{"Suikastçı":.5,"Topçu":-.5,"Nişancı":-.5},"Hasar":{"Nişancı":.5,"Destek":.5,"Tank":-.5},"Destek":{"Suikastçı":-.5,"Topçu":-.5}};
const D={"Gem Grab":{"Hard Rock Mine":["Mr. P","Bo","Amber","Gus","Bolt"],"Double Swoosh":["Bolt","Bo","Angelo","Amber","Gus"],"Undermine":["Mr. P","Bo","Juju","Gus","Bolt"]},"Brawl Ball":{"Backyard Bowl":["Hank","Bibi","Edgar","Trunk","Juju"],"Pinhole Punt":["Bibi","Edgar","Trunk","Hank","Gus"],"Super Beach":["Bibi","Hank","Edgar","Trunk","Starr Nova"]},"Knockout":{"Goldarm Gulch":["Bolt","Angelo","Wendy","Bo","Nori"],"Out in the Open":["Angelo","Bolt","Wendy","Starr Nova","Bo"],"Belle’s Rock":["Bolt","Wendy","Bo","Gus","Amber"]},"Heist":{"Safe Zone":["Hank","Trunk","Edgar","Colt","Dynamike"],"Kaboom Canyon":["Colt","Dynamike","Trunk","Hank","Bibi"],"Hot Potato":["Colt","Trunk","Hank","Edgar","Dynamike"]},"Hot Zone":{"Ring of Fire":["Pam","Squeak","Hank","Trunk","Mr. P"],"Dueling Beetles":["Pam","Hank","Mr. P","Bo","Squeak"],"Parallel Plays":["Pam","Squeak","Hank","Trunk","Wendy"]},"Bounty":{"Snake Prairie":["Angelo","Bolt","Wendy","Bo","Starr Nova"],"Shooting Star":["Angelo","Bolt","Wendy","Nori","Bo"],"Canal Grande":["Bolt","Angelo","Wendy","Amber","Bo"]}};
const $=id=>document.getElementById(id);
const low=s=>String(s||"").toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 .]/g,"").trim();
const canon=n=>Object.keys(B).find(k=>low(k)===low(n));
const clean=a=>[...new Set((Array.isArray(a)?a:[]).map(canon).filter(Boolean))];
const pickMode=m=>Object.keys(D).find(k=>low(k)===low(m));
const pickMap=(m,p)=>m&&Object.keys(D[m]).find(k=>low(k)===low(p));

function plan(S){
  const mp=(S.mode&&S.map&&D[S.mode][S.map])||[];
  const taken=n=>S.ban.includes(n)||S.en.includes(n)||S.al.includes(n);
  const fit=n=>{const i=mp.indexOf(n);return i>=0?3-i*.4:0};
  const picks=[],bans=[];
  for(const [n,[cls,base]] of Object.entries(B)){
    if(taken(n))continue;
    let s=base+fit(n),why=[];
    if(fit(n))why.push("haritada güçlü");
    let c=0,best=null;
    for(const e of S.en){const v=(C[cls]||{})[B[e][0]]||0;c+=v;if(v>=.5&&(!best||v>best[1]))best=[e,v]}
    s+=c*1.2;if(best)why.push(best[0]+" karşısında iyi");
    const ac=S.al.map(a=>B[a][0]);
    if(ac.includes(cls)&&cls!=="Destek")s-=.6;
    if(!ac.includes("Tank")&&cls==="Tank")s+=.5;
    if(!ac.some(x=>x==="Nişancı"||x==="Kontrol")&&(cls==="Nişancı"||cls==="Kontrol"))s+=.5;
    picks.push({n,s,why:why.join(" · ")||"meta gücü"});
    let bs=base+fit(n),bw=[];
    if(fit(n))bw.push("haritada güçlü");
    let cc=0,bb=null;
    for(const a of S.al){const v=(C[cls]||{})[B[a][0]]||0;cc+=v;if(v>=.5&&(!bb||v>bb[1]))bb=[a,v]}
    bs+=cc*1.2;if(bb)bw.push(bb[0]+" takımına karşı iyi");
    bans.push({n,s:bs,why:bw.join(" · ")||"meta gücü"});
  }
  const sort=a=>a.sort((x,y)=>y.s-x.s);
  return {picks:sort(picks).slice(0,4),bans:S.ban.length>=6?[]:sort(bans).slice(0,3)};
}
function showHud(S){
  const p=plan(S),row=x=>`<div class="it"><b>${x.n}</b><span>${x.why}</span></div>`;
  $("hb").innerHTML=
   `<div class="det">${S.mode||"Mod ?"} · ${S.map||"Harita ?"}</div>`+
   (p.bans.length?`<h4>🚫 Yasakla</h4><div class="bn">${p.bans.map(row).join("")}</div>`:`<h4>🚫 Banlar dolu</h4>`)+
   `<h4>✅ Seç</h4><div class="pk">${p.picks.map(row).join("")}</div>`+
   `<div class="det">Yasaklı: ${S.ban.join(", ")||"—"}<br>Rakip: ${S.en.join(", ")||"—"}<br>Takım: ${S.al.join(", ")||"—"}</div>`;
}

const KEYS="sk_k";
try{$("key").value=localStorage.getItem(KEYS)||""}catch(e){}
function toBlob(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>b?res({b,u}):rej(new Error("Görsel işlenemedi")),"image/jpeg",.82);
    };
    img.onerror=()=>rej(new Error("Görsel açılamadı"));img.src=u;
  });
}
function toB64(blob){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(blob)})}
async function analyze(file){
  const key=$("key").value.trim();
  if(!key){$("st").textContent="Önce API anahtarını gir.";return}
  try{localStorage.setItem(KEYS,key)}catch(e){}
  $("pick").disabled=true;$("st").textContent="Claude ekranı okuyor…";
  try{
    const {b,u}=await toBlob(file);$("prev").src=u;$("prev").style.display="block";
    const data64=await toB64(b);
    const prompt=`Bu bir Brawl Stars draft/seçim ekranı görüntüsü. SADECE şu JSON'u döndür, başka metin yok: {"mode":"","map":"","bans":[],"enemy":[],"ally":[]}
mode şunlardan biri olsun: ${Object.keys(D).join(", ")} (değilse boş bırak). map: ekranda yazan İngilizce harita adı (yazmıyorsa boş). bans: yasaklanan karakterler. enemy: rakip takımın seçtikleri. ally: kendi takımın seçtikleri. Karakter adları SADECE bu listeden: ${Object.keys(B).join(", ")}. Net okuyamadığını yazma, uydurma. Draft ekranı değilse hepsini boş bırak.`;
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:400,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:data64}},{type:"text",text:prompt}]}]})});
    if(!r.ok)throw new Error("API "+r.status+(r.status===401?" (anahtar geçersiz)":""));
    const j=await r.json(),t=j.content[0].text,o=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
    const mode=pickMode(o.mode);
    showHud({mode,map:pickMap(mode,o.map)||o.map||"",ban:clean(o.bans),en:clean(o.enemy),al:clean(o.ally)});
    $("st").textContent="Güncellendi "+new Date().toLocaleTimeString("tr-TR");
  }catch(e){$("st").textContent="Hata: "+(e.message||"okunamadı")}
  finally{$("pick").disabled=false}
}
$("pick").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(f)analyze(f);e.target.value=""};
</script>
</body>
</html>
